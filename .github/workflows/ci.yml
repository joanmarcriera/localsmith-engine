name: ci

# pytest gate for the stdlib-only orchestrator (Phase 1 has no third-party deps).
# Secret scanning lives in gitleaks.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q tests
